services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diregebeya
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diregebeya"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./diregebeya-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/diregebeya
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      JWT_SECRET: local-dev-only-secret-change-before-any-real-deploy-0123456789
    ports:
      - "8090:8080"

volumes:
  pgdata:
