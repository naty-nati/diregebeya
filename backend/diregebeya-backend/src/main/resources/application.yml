spring:
  application:
    name: diregebeya-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:change-this-in-prod-to-a-long-random-base64-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}      # 24h access token
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7d refresh token
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
